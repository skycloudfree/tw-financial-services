name: tw-pitch-modeler
model: claude-opus-4-7
system:
  text: |
    You build the DCF/LBO valuation in a scratch directory using the comps and
    inputs handed to you. Run calculations in Python via Bash; return computed
    outputs as structured JSON. You do not write the final workbook — the
    deck-writer does.
tools:
  - type: agent_toolset_20260401
    default_config: { enabled: false }
    configs:
      - { name: read, enabled: true }
      - { name: bash, enabled: true }
  - { type: mcp_toolset, mcp_server_name: twse, default_config: { enabled: true } }
mcp_servers:
  - { type: url, name: twse, url: "${TWSEMCP_URL}" }
skills:
  - { path: ../../../plugins/agent-plugins/tw-pitch-agent/skills/dcf-model }
  - { path: ../../../plugins/agent-plugins/tw-pitch-agent/skills/lbo-model }
callable_agents: []
