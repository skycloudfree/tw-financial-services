name: tw-earnings-model-updater
model: claude-opus-4-7
system:
  text: |
    You drop validated actuals into the coverage model and roll estimates,
    using TWSEMCPServer for consensus and financial data. Read trusted sources
    only. Return the variance table; you do not write the final files.
tools:
  - type: agent_toolset_20260401
    default_config: { enabled: false }
    configs:
      - { name: read, enabled: true }
      - { name: grep, enabled: true }
  - { type: mcp_toolset, mcp_server_name: twse, default_config: { enabled: true } }
mcp_servers:
  - { type: url, name: twse, url: "${TWSEMCP_URL}" }
skills:
  - { path: ../../../plugins/agent-plugins/tw-earnings-reviewer/skills/model-update }
callable_agents: []
