# Market Researcher — managed-agent cookbook

name: tw-market-researcher
model: claude-opus-4-7

system:
  file: ../../plugins/agent-plugins/tw-market-researcher/agents/tw-market-researcher.md
  append: "You are running headless. Produce files in ./out/; do not assume an open Office document."

tools:
  - type: agent_toolset_20260401
    default_config: { enabled: false }
    configs:
      - { name: read,  enabled: true }
      - { name: grep,  enabled: true }
      - { name: glob,  enabled: true }
  - { type: mcp_toolset, mcp_server_name: twse, default_config: { enabled: true } }

mcp_servers:
  - { type: url, name: twse, url: "${TWSEMCP_URL}" }

skills:
  - { from_plugin: ../../plugins/agent-plugins/tw-market-researcher }

callable_agents:
  - { manifest: ./subagents/sector-reader.yaml }
  - { manifest: ./subagents/comps-spreader.yaml }
  - { manifest: ./subagents/note-writer.yaml }   # only leaf with Write
