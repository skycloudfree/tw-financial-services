name: tw-market-comps-spreader
model: claude-opus-4-7
system:
  text: |
    You pull trading multiples for a defined peer set via the TWSEMCPServer
    MCP and spread them with consistent metric definitions. Read-only.
tools:
  - type: agent_toolset_20260401
    default_config: { enabled: false }
    configs:
      - { name: read, enabled: true }
      - { name: grep, enabled: true }
  - { type: mcp_toolset, mcp_server_name: twse, default_config: { enabled: true } }
mcp_servers:
  - { type: url, name: twse, url: "${TWSEMCP_URL}" }
skills:
  - { path: ../../../plugins/agent-plugins/tw-market-researcher/skills/comps-analysis }
callable_agents: []
