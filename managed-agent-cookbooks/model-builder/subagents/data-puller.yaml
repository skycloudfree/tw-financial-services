name: tw-model-data-puller
model: claude-opus-4-7
system:
  text: |
    You pull historicals and consensus from TWSEMCPServer for the requested
    ticker and return a structured input table. Read-only.
tools:
  - type: agent_toolset_20260401
    default_config: { enabled: false }
    configs:
      - { name: read, enabled: true }
      - { name: grep, enabled: true }
  - { type: mcp_toolset, mcp_server_name: twse, default_config: { enabled: true } }
mcp_servers:
  - { type: url, name: twse, url: "${TWSEMCP_URL}" }
skills: []
callable_agents: []
output_schema:
  type: object
  required: [ticker, historicals]
  additionalProperties: false
  properties:
    ticker: { type: string, maxLength: 12, pattern: "^[A-Z0-9.]+$" }
    historicals:
      type: object
      additionalProperties: { type: number }
    consensus:
      type: object
      additionalProperties: { type: number }
